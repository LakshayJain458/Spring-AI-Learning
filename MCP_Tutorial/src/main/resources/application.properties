spring.application.name=MCP_Tutorial

server.port=8080

spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

app.ai.openrouter.enabled=true
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENROUTER_TEMPERATURE:0.7}
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.mcp.client.stdio.servers-configuration=classpath:servers.json