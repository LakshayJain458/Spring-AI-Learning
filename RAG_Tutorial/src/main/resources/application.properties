spring.application.name=Spring_AI

# --- Spring AI Model Selection ------------------------------------------------
# Chat is the only capability used. All other OpenAI model types auto-configure
# by default (matchIfMissing=true) and crash because OpenRouter does not support
# them. Set each to 'none' to prevent those auto-configurations from firing.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# --- Default AI Provider -------------------------------------------------------
# Which provider to use when none is specified in the request.
# Accepted values: ollama | openrouter
app.ai.default-provider=ollama
app.ai.ollama.enabled=true
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=phi3:mini
spring.ai.ollama.chat.options.temperature=0.7

spring.ai.model.embedding=openai
spring.ai.openai.embedding.enabled=true
spring.ai.ollama.embedding.enabled=false

app.ai.openrouter.enabled=true
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENROUTER_TEMPERATURE:0.7}


#PostgreSQL configuration
spring.datasource.url=jdbc:mariadb://localhost:3307/springAi
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.ai.vectorstore.mariadb.dimensions=1536
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=cosine

